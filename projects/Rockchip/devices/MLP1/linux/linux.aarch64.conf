# The board's DSI panel driver (drivers/gpu/drm/panel/panel-miniloong-pocket1.c)
# matches compatible "miniloong,pocket1-panel" in the board DTS - the Kconfig
# symbol and driver keep the kernel fork's board name even though the AmberELEC
# device was renamed to MLP1. It is a plain tristate with no 'select' pointing
# at it, so oldconfig leaves it off unless we ask. Without it the panel never
# probes, the DSI/VOP2 pipeline never comes up and the backlight - which this
# driver owns - stays dark.
CONFIG_DRM_PANEL_MINILOONG_POCKET1=y
# The MIPI DSI D-PHY. Without it dw-mipi-dsi never finishes probing, so it
# never registers as a Rockchip DRM component - and the DRM master then waits
# silently forever. Symptom: zero drm/dsi/panel messages in dmesg, VOP2 probes
# but nothing ever binds, no backlight. dArkOS sets this; we did not.
CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY=y
# NoC-probe devfreq event driver that rockchip-dmc waits on. Without it dmc
# loops forever on "probe: get_event failed: -517", never probes, and its
# clocks then look unused - which is why clk_ignore_unused was needed.
CONFIG_DEVFREQ_EVENT_ROCKCHIP_NOCP=y
