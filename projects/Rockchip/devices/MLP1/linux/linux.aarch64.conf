# libmali's GBM allocator gets its scanout buffers from /dev/dma_heap/*. Without
# these the blob's probe of system / system-uncached / protected all return
# -ENOENT, GBM surface creation fails, and EmulationStation exits 1 before it
# ever opens /dev/mali0 - a black screen with no log, because ES's logger writes
# to a file it hasn't created yet. dArkOS sets exactly these.
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_DEFERRED_FREE=y
CONFIG_DMABUF_HEAPS_PAGE_POOL=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
CONFIG_DMABUF_HEAPS_CMA=y

# The RTL8723DS BT core sits on UART and reports the same LMP subversion and HCI
# revision as the USB RTL8723D. btrtl's generic 8723D entry has no bus check and
# precedes the 8723DS one, so it requests rtl_bt/rtl8723d_* - and linux-firmware
# only has the USB images under those names, which leave hci0 DOWN with a zero
# address ("no UART config entry found"). Build the UART images in under the
# requested names (from devices/MLP1/firmware); built-in also means they are
# there for hci_h5's probe, which runs before the rootfs is mounted.
CONFIG_EXTRA_FIRMWARE="rtl_bt/rtl8723d_fw.bin rtl_bt/rtl8723d_config.bin"
CONFIG_EXTRA_FIRMWARE_DIR="external-firmware"
