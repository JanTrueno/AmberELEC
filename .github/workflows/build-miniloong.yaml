name: build-miniloong

# MiniLoong Pocket 1 validation on GitHub-hosted runners.
#
# The upstream build-main workflow targets `runs-on: main`, a self-hosted machine
# with a persistent workspace and warm ccache, which forks cannot use. A
# GitHub-hosted runner has ~14GB of free disk and a hard 6h job cap, so a full
# image build is best-effort at best. The kernel-smoke job exists to answer the
# one question that actually blocks this port - does the 5.10 BSP kernel build
# with our config fragment - without waiting hours for AmberELEC's own toolchain.

on:
  workflow_dispatch:
    inputs:
      full_image:
        description: "Also attempt the full AmberELEC image (best effort, may hit the 6h cap)"
        type: boolean
        default: false
  push:
    branches:
      - dev
    paths:
      - "projects/Rockchip/devices/MINILOONG/**"
      - "projects/Rockchip/packages/**"
      - "projects/Rockchip/bootloader/**"
      - ".github/workflows/build-miniloong.yaml"

jobs:
  kernel-smoke:
    name: Kernel + DTB smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deliberately NOT running in a container. The runner image already ships
    # build-essential/bc/bison/flex/libssl, so this needs one small package
    # instead of bootstrapping a whole base image - earlier container runs spent
    # 20+ minutes in apt before reaching anything interesting. AmberELEC builds
    # its own cross toolchain, so no container choice here would have matched
    # the real build anyway; what this job validates is the config fragment.
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Choose a writable kernel directory
        # Host runner jobs are not root, so the tree cannot live at /kernel.
        # This is set here rather than in the job `env:` because the `runner`
        # context is not available at job level.
        run: echo "KDIR=${RUNNER_TEMP}/kernel" >> "$GITHUB_ENV"

      - name: Install cross toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross python-is-python3
          # This tree's scripts/gcc-wrapper.py has a `#!/usr/bin/env python`
          # shebang. Without a plain `python` on PATH it fails to execute, and
          # scripts/as-version.sh then reports "unknown assembler invoked",
          # which aborts Kconfig before it ever reads our config.
          python --version
          aarch64-linux-gnu-gcc --version | head -1

      - uses: actions/checkout@v4
        name: Checkout AmberELEC

      - name: Resolve pinned kernel source from linux/package.mk
        id: kernel
        run: |
          set -eux
          MK=projects/Rockchip/packages/linux/package.mk
          # Pull the MINILOONG branch's pinned commit and repo out of package.mk
          # so this job can never drift from what the real build uses.
          SHA=$(grep -A3 'DEVICE.*== MINILOONG' "$MK" | grep -m1 'PKG_VERSION=' | cut -d'"' -f2)
          URL=$(grep -A4 'DEVICE.*== MINILOONG' "$MK" | grep -m1 'PKG_URL=' | cut -d'"' -f2)
          REPO=$(echo "$URL" | sed -E 's#https://github.com/([^/]+/[^/]+)/archive/.*#\1#')
          test -n "$SHA" && test -n "$REPO"
          echo "sha=$SHA"   >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Fetch kernel tree
        run: |
          set -eux
          mkdir -p ${KDIR}
          curl -fsSL "https://github.com/${{ steps.kernel.outputs.repo }}/archive/${{ steps.kernel.outputs.sha }}.tar.gz" \
            | tar xz --strip-components=1 -C ${KDIR}

      - name: Apply AmberELEC config fragment
        run: |
          set -eux
          cp projects/Rockchip/devices/MINILOONG/linux/linux.aarch64.conf ${KDIR}/.config
          # Mirrors what linux/package.mk does: drop the fragment in as .config and
          # let Kconfig fill in the rest.
          make -C ${KDIR} olddefconfig

      - name: Check the symbols we actually depend on survived olddefconfig
        run: |
          set -eu
          cd ${KDIR}
          # Kconfig silently drops anything whose dependencies are unmet, which is
          # exactly how a device ends up booting without exfat / joystick / audio.
          rc=0
          for sym in \
            CONFIG_EXFAT_FS \
            CONFIG_JOYSTICK_SINGLEADCJOY \
            CONFIG_BATTERY_RK817 \
            CONFIG_CHARGER_RK817 \
            CONFIG_SND_SOC_RK817 \
            CONFIG_MALI_BIFROST \
            CONFIG_DRM_ROCKCHIP \
            CONFIG_ROCKCHIP_DW_MIPI_DSI \
            CONFIG_ROCKCHIP_SARADC \
            CONFIG_BACKLIGHT_PWM \
            CONFIG_CPU_RK3568 \
            CONFIG_RTL8723DS ; do
            if grep -qE "^${sym}=(y|m)" .config; then
              echo "ok      ${sym}=$(grep -m1 -E "^${sym}=" .config | cut -d= -f2)"
            else
              echo "DROPPED ${sym}"
              rc=1
            fi
          done
          exit $rc

      - name: Build MiniLoong DTB
        id: dtb
        run: |
          set -eux
          # The DTB is the cheap, high-signal half: it proves the board DTS and
          # its includes actually resolve against this tree.
          make -C ${KDIR} -j"$(nproc)" rockchip/rk3566-miniloong.dtb

      - name: Build Image (best effort)
        id: image
        continue-on-error: true
        run: |
          set -eux
          # Non-blocking on purpose. The runner's cross gcc is much newer than
          # the one AmberELEC builds for the real image, so a compile failure
          # here does not necessarily indicate a problem with the port - and it
          # must not mask the config/DTB results above, which are what this job
          # exists to report. KCFLAGS mirrors linux/package.mk.
          make -C ${KDIR} -j"$(nproc)" KCFLAGS="-w" Image

      - name: Summarise
        if: always()
        run: |
          set -eu
          {
            echo "### MiniLoong kernel smoke build"
            echo ""
            echo "- kernel: \`${{ steps.kernel.outputs.repo }}@${{ steps.kernel.outputs.sha }}\`"
            if [ -f ${KDIR}/arch/arm64/boot/Image ]; then
              echo "- Image: $(stat -c%s ${KDIR}/arch/arm64/boot/Image) bytes"
            else
              echo "- Image: **not built** (best-effort step; runner gcc is newer than AmberELEC's)"
            fi
            if [ -f ${KDIR}/arch/arm64/boot/dts/rockchip/rk3566-miniloong.dtb ]; then
              echo "- rk3566-miniloong.dtb: $(stat -c%s ${KDIR}/arch/arm64/boot/dts/rockchip/rk3566-miniloong.dtb) bytes"
            else
              echo "- rk3566-miniloong.dtb: **not built**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts into the workspace
        if: always()
        run: |
          set -eu
          # upload-artifact only handles paths inside the workspace.
          mkdir -p out
          cp ${KDIR}/.config out/kernel.config 2>/dev/null || true
          cp ${KDIR}/arch/arm64/boot/Image out/ 2>/dev/null || true
          cp ${KDIR}/arch/arm64/boot/dts/rockchip/rk3566-miniloong.dtb out/ 2>/dev/null || true
          ls -la out || true

      - name: Upload kernel config and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniloong-kernel-smoke
          path: out/
          if-no-files-found: warn

  amberelec-linux:
    # The authoritative kernel answer. Unlike kernel-smoke, this uses AmberELEC's
    # own build system and its own cross toolchain inside the pinned ubuntu:20.04
    # image, so a pass here means the kernel really builds the way the image build
    # would do it. It is slow (the toolchain is built from source first), which is
    # why the fast proxy job exists alongside it rather than instead of it.
    name: Kernel via AmberELEC build system
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune -af || true
          df -h /

      - name: Get the AmberELEC build image
        run: |
          set -eux
          # Prefer the image AmberELEC's own CI uses - it is public, so this works
          # from a fork, and it avoids rebuilding the Dockerfile whose apt step has
          # been failing on unreachable Ubuntu mirrors from GitHub runners.
          if docker pull ghcr.io/amberelec/amberelec-build:latest; then
            docker tag ghcr.io/amberelec/amberelec-build:latest amberelec-build:local
          else
            echo "ghcr pull failed, falling back to building the Dockerfile" >&2
            for i in 1 2 3; do
              docker build -t amberelec-build:local . && break
              echo "docker build failed (attempt $i), retrying" >&2
              sleep 30
            done
          fi
          docker image inspect amberelec-build:local >/dev/null

      - name: Build the linux package for MINILOONG
        run: |
          set -eux
          # Retried because the toolchain pulls sources from a lot of upstream
          # hosts and any one of them being briefly unreachable kills an hour of
          # work. Downloads land in sources/ and finished packages are stamped,
          # so a retry resumes rather than starting over.
          for attempt in 1 2 3; do
            if docker run --rm \
                 -v "${PWD}":/work -w /work \
                 -u "$(id -u):$(id -g)" \
                 -e HOME=/tmp \
                 amberelec-build:local \
                 bash -c "DEVICE=MINILOONG ARCH=aarch64 ./scripts/build linux"; then
              echo "build succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::build attempt ${attempt} failed, retrying" >&2
            sleep 60
          done
          echo "::error::build failed after 3 attempts" >&2
          exit 1

      - name: Collect build output
        if: always()
        run: |
          set -eu
          mkdir -p out
          # No -maxdepth: the kernel outputs live at build.*/linux-*/arch/arm64/boot/.
          # Everything is copied into out/ and only out/ is uploaded, because
          # globbing build.* directly makes the upload walk initramfs/, which
          # contains 0700 dirs it cannot read (EACCES).
          find build.*/ -name "Image" -path "*arch/arm64/boot*" \
            -exec cp -v {} out/ \; 2>/dev/null || true
          find build.*/ -name "rk3566-miniloong.dtb" \
            -exec cp -v {} out/ \; 2>/dev/null || true
          find build.*/ -maxdepth 2 -name ".config" -path "*linux*" \
            -exec cp -v {} out/kernel.config \; 2>/dev/null || true
          find build.*/ -maxdepth 2 -name "*.log" \
            -exec cp -v {} out/ \; 2>/dev/null || true
          echo "--- collected ---"
          ls -la out

      - name: Report what was built
        if: always()
        run: |
          set -eu
          {
            echo "### MiniLoong kernel via AmberELEC build system"
            echo ""
            for f in out/Image out/rk3566-miniloong.dtb; do
              if [ -f "$f" ]; then
                echo "- \`$(basename $f)\`: $(stat -c%s "$f") bytes"
              else
                echo "- \`$(basename $f)\`: **missing**"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniloong-amberelec-linux
          path: out/
          if-no-files-found: warn

  full-image:
    name: Full image (best effort)
    needs: [amberelec-linux]
    if: inputs.full_image
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune -af || true
          df -h /

      - name: Build MINILOONG image
        run: |
          set -eux
          # Exactly what AmberELEC's own build-main workflow runs, just for a
          # device it does not have a job for. DOCKER_IMAGE already defaults to
          # this in the Makefile; set explicitly for clarity.
          DOCKER_IMAGE=ghcr.io/amberelec/amberelec-build:latest \
            make DOCKER_WORK_DIR=/work docker-MINILOONG

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmberELEC-MINILOONG
          path: release/
          if-no-files-found: warn
